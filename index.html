<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NFC Tapki</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
        body{min-height:100vh;background:#0a0505;display:flex;justify-content:center;align-items:center;font-family:system-ui,sans-serif;padding:20px;overflow:hidden}
        canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;display:block}
        .container{position:relative;z-index:2;text-align:center;width:100%;max-width:380px}
        .glass-circle{width:260px;height:260px;border-radius:50%;margin:0 auto 40px;overflow:hidden;backdrop-filter:blur(18px);background:rgba(0,0,0,0.3);border:1px solid rgba(255,180,180,0.3);cursor:pointer;transition:0.1s;display:flex;align-items:center;justify-content:center}
        .glass-circle:active{transform:scale(0.96);box-shadow:0 0 50px rgba(255,50,50,0.5)}
        .glass-circle img{width:100%;height:100%;object-fit:cover}
        .visualizer{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-bottom:35px;height:50px}
        .visualizer .bar{width:5px;background:rgba(255,100,100,0.9);border-radius:3px;transition:height 0.05s;box-shadow:0 0 6px rgba(255,50,50,0.5)}
        .description{color:rgba(255,255,255,0.6);font-size:12px;display:inline-block;padding:5px 16px;border-radius:30px;background:rgba(0,0,0,0.3)}
        .tap-glow{position:fixed;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,200,0.3),transparent 70%);pointer-events:none;transform:translate(-50%,-50%) scale(0.3);animation:glowFade 0.5s forwards;z-index:9999}
        @keyframes glowFade{to{opacity:0;transform:translate(-50%,-50%) scale(2.2)}}
        @media(max-width:550px){.glass-circle{width:210px;height:210px;margin-bottom:35px}.visualizer{gap:4px}.visualizer .bar{width:4px}}
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div class="container">
        <div class="glass-circle" id="playButton"><img src="tapki.png" alt="Tapki" id="tapkiImage"></div>
        <div class="visualizer" id="visualizer"></div>
        <div class="description">🎭 Мемные звуки • NFC пранки</div>
    </div>
    <audio id="audioPlayer" preload="auto"><source src="skachai-maks.mp3" type="audio/mpeg"></audio>
    <script>
        const canvas=document.getElementById('bgCanvas'),ctx=canvas.getContext('2d');
        let w,h,parts=[];
        function resize(){w=innerWidth;h=innerHeight;canvas.width=w;canvas.height=h}
        for(let i=0;i<60;i++) parts.push({x:Math.random()*w,y:Math.random()*h,r:2+Math.random()*4,vx:(Math.random()-0.5)*0.8,vy:(Math.random()-0.5)*0.8,op:0.3+Math.random()*0.5});
        function draw(){
            ctx.fillStyle='#0a0505';ctx.fillRect(0,0,w,h);
            for(let p of parts){
                p.x+=p.vx;p.y+=p.vy;
                if(p.x<-20)p.x=w+20;if(p.x>w+20)p.x=-20;if(p.y<-20)p.y=h+20;if(p.y>h+20)p.y=-20;
                ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,200,200,${p.op*0.4})`;ctx.fill();
            }
            requestAnimationFrame(draw);
        }
        window.onresize=resize;resize();draw();
        const btn=document.getElementById('playButton'),audio=document.getElementById('audioPlayer'),bars=document.querySelectorAll('.visualizer .bar');
        let anim=null,acx=null,src=null,anal=null,setUp=false;
        function setupAudio(){if(setUp)return;try{acx=new AudioContext;src=acx.createMediaElementSource(audio);anal=acx.createAnalyser();anal.fftSize=256;src.connect(anal);anal.connect(acx.destination);setUp=true}catch(e){}}
        function update(){
            if(!audio.paused&&audio.currentTime>0&&anal){
                let data=new Uint8Array(anal.frequencyBinCount);anal.getByteFrequencyData(data);
                let step=Math.floor(data.length/bars.length);
                bars.forEach((bar,i)=>{let v=0;for(let j=0;j<step;j++)v+=data[i*step+j]||0;let h=4+(v/step/255)*55;bar.style.height=Math.min(h,50)+'px'});
                anim=requestAnimationFrame(update);
            }else if(!audio.paused&&audio.currentTime>0){
                bars.forEach(bar=>bar.style.height=(8+Math.random()*42)+'px');
                anim=requestAnimationFrame(update);
            }else bars.forEach(bar=>bar.style.height='4px');
        }
        audio.load();
        function play(){if(!setUp)setupAudio();audio.currentTime=0;if(acx&&acx.state==='suspended')acx.resume();audio.play().then(()=>{if(anim)cancelAnimationFrame(anim);anim=requestAnimationFrame(update)}).catch(()=>{let m=document.createElement('div');m.textContent='🔊 Нажми ещё раз';m.style.cssText='position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#fff;padding:8px 18px;border-radius:40px;z-index:10000';document.body.appendChild(m);setTimeout(()=>m.remove(),1500)});}
        audio.onpause=audio.onended=()=>{if(anim)cancelAnimationFrame(anim);bars.forEach(bar=>bar.style.height='4px')};
        btn.onclick=btn.ontouchstart=play;
        document.onpointerdown=e=>{let g=document.createElement('div');g.className='tap-glow';g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';document.body.appendChild(g);setTimeout(()=>g.remove(),500)};
        document.getElementById('tapkiImage').onerror=function(){this.style.display='none';let fb=document.createElement('div');fb.textContent='🩴';fb.style.cssText='font-size:100px;width:100%;height:100%;display:flex;align-items:center;justify-content:center';this.parentNode.appendChild(fb)};
    </script>
    <script>document.querySelector('.visualizer').innerHTML='<div class="bar"></div>'.repeat(12);</script>
</body>
</html>
